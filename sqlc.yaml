version: "2"
sql:
  - engine: postgresql
    schema: db/migrations/postgres
    queries: db/query
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: NullUUID
          - db_type: text
            nullable: true
            go_type:
              import: github.com/uvwt/CycleDock/internal/sqldb
              type: Text
          - db_type: pg_catalog.timestamptz
            go_type:
              import: github.com/uvwt/CycleDock/internal/sqldb
              type: Timestamptz
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type:
              import: github.com/uvwt/CycleDock/internal/sqldb
              type: Timestamptz
          - db_type: timestamptz
            go_type:
              import: github.com/uvwt/CycleDock/internal/sqldb
              type: Timestamptz
          - db_type: timestamptz
            nullable: true
            go_type:
              import: github.com/uvwt/CycleDock/internal/sqldb
              type: Timestamptz
          - db_type: pg_catalog.int2
            nullable: true
            go_type:
              import: github.com/uvwt/CycleDock/internal/sqldb
              type: Int2
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              import: github.com/uvwt/CycleDock/internal/sqldb
              type: Int4
          - db_type: pg_catalog.int8
            nullable: true
            go_type:
              import: github.com/uvwt/CycleDock/internal/sqldb
              type: Int8
          - db_type: pg_catalog.bool
            nullable: true
            go_type:
              import: github.com/uvwt/CycleDock/internal/sqldb
              type: Bool
          - db_type: pg_catalog.time
            go_type:
              import: github.com/uvwt/CycleDock/internal/sqldb
              type: Time
          - db_type: pg_catalog.time
            nullable: true
            go_type:
              import: github.com/uvwt/CycleDock/internal/sqldb
              type: Time

