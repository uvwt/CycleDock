name: Publish image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cycledock-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/uvwt/cycledock:sha-${{ github.sha }}
            ghcr.io/uvwt/cycledock:main
          labels: |
            org.opencontainers.image.source=https://github.com/uvwt/CycleDock
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish digest
        run: echo "digest=${{ steps.build.outputs.digest }}"
