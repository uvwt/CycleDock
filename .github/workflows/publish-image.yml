name: Publish image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: cycledock-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/uvwt/cycledock-oss:sha-${GITHUB_SHA}"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "ghcr.io/uvwt/cycledock-oss:main"
            fi
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "ghcr.io/uvwt/cycledock-oss:${GITHUB_REF_NAME}"
              case "${GITHUB_REF_NAME}" in
                *-*) ;;
                *) echo "ghcr.io/uvwt/cycledock-oss:latest" ;;
              esac
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/uvwt/CycleDock
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Publish digest
        run: echo "digest=${{ steps.build.outputs.digest }}"
