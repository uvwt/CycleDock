root = "."
tmp_dir = "tmp/air"

[build]
  cmd = "go build -o ./tmp/air/cycledock ./cmd/cycledock"
  bin = "./tmp/air/cycledock"
  include_dir = ["cmd/cycledock", "internal"]
  include_ext = ["go"]
  exclude_dir = ["web", "bin", "tmp", ".git"]
  exclude_regex = ["_test.go$"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[misc]
  clean_on_exit = true
