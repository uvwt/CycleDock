services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cycledock
      POSTGRES_USER: cycledock
      POSTGRES_PASSWORD: cycledock
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cycledock -d cycledock"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - cycledock_postgres:/var/lib/postgresql/data

  migrate:
    build: .
    environment:
      DATABASE_URL: postgres://cycledock:cycledock@postgres:5432/cycledock?sslmode=disable
      MIGRATIONS_DIR: /app/db/migrations
    entrypoint: ["/usr/local/bin/cycledock-migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment:
      DATABASE_URL: postgres://cycledock:cycledock@postgres:5432/cycledock?sslmode=disable
      HTTP_ADDR: :8080
      WEB_DIR: /app/web
      CYCLEDOCK_ADMIN_PASSWORD: ${CYCLEDOCK_ADMIN_PASSWORD:-}
      CYCLEDOCK_PUBLIC_URL: ${CYCLEDOCK_PUBLIC_URL:-}
      CYCLEDOCK_OIDC_ISSUER: ${CYCLEDOCK_OIDC_ISSUER:-}
      CYCLEDOCK_OIDC_CLIENT_ID: ${CYCLEDOCK_OIDC_CLIENT_ID:-}
      CYCLEDOCK_NEXUSDOCK_MCP_URL: ${CYCLEDOCK_NEXUSDOCK_MCP_URL:-}
      CYCLEDOCK_NEXUSDOCK_WEB_URL: ${CYCLEDOCK_NEXUSDOCK_WEB_URL:-}
      CYCLEDOCK_CONNECTION_ENCRYPTION_KEY: ${CYCLEDOCK_CONNECTION_ENCRYPTION_KEY:-}
      CYCLEDOCK_SECURE_COOKIE: ${CYCLEDOCK_SECURE_COOKIE:-}
      # 模型 API Key 使用环境变量；普通 MCP Bearer Token 经上方连接密钥加密存储。
      CYCLEDOCK_MODEL_API_KEY: ${CYCLEDOCK_MODEL_API_KEY:-}
      CYCLEDOCK_MODEL_SECRET_KEY: ${CYCLEDOCK_MODEL_SECRET_KEY:-}
      CYCLEDOCK_CHATGPT_CLIENT_ID: ${CYCLEDOCK_CHATGPT_CLIENT_ID:-}
      CYCLEDOCK_CHATGPT_ALLOW_HOSTED_DYNAMIC_REGISTRATION: ${CYCLEDOCK_CHATGPT_ALLOW_HOSTED_DYNAMIC_REGISTRATION:-}
      CYCLEDOCK_VAPID_PUBLIC_KEY: ${CYCLEDOCK_VAPID_PUBLIC_KEY:-}
      CYCLEDOCK_VAPID_PRIVATE_KEY: ${CYCLEDOCK_VAPID_PRIVATE_KEY:-}
      CYCLEDOCK_VAPID_SUBJECT: ${CYCLEDOCK_VAPID_SUBJECT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  cycledock_postgres:
